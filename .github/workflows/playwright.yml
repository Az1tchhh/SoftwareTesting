name: Playwright Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      groups:
        description: Number of parallel groups (choose 1 for a timing baseline)
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.groups == '1' && '[1]' || '[1,2,3,4]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assignments/Assignment2/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r assignments/Assignment2/requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Prepare report directory
        run: mkdir -p reports
        working-directory: assignments/Assignment2

      - name: Run pytest group
        run: >-
          pytest
          --splits=${{ inputs.groups || '4' }}
          --group=${{ matrix.group }}
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --video=retain-on-failure
          --html=reports/report.html
          --self-contained-html
          --junitxml=reports/junit.xml
        working-directory: assignments/Assignment2

      - name: Upload HTML and JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: pytest-reports-${{ matrix.group }}
          path: assignments/Assignment2/reports/
          retention-days: 14

      - name: Upload traces and failure media
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.group }}
          path: assignments/Assignment2/test-results/
          if-no-files-found: ignore
          retention-days: 14
